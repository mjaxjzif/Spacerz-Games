<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spacerz Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060616;--panel:#101036;--line:#2c2c78;--txt:#eef0ff;--mut:#98a0d8;--v:#7c5cff;--c:#00e5ff;--p:#ff4fd8;--y:#ffd84f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 15% 0%,#2a1566 0,transparent 50%),radial-gradient(ellipse at 90% 30%,#0a3a66 0,transparent 45%),var(--bg);color:var(--txt);font-family:'Exo 2',system-ui,sans-serif;min-height:100vh}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(22px,5vw,34px);letter-spacing:.04em;background:linear-gradient(90deg,var(--c),var(--v),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #7c5cff88)}
.me{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.me b{font-family:Orbitron}
.coin{color:var(--y);font-weight:600}
.hero{margin:26px 0 18px;padding:28px 22px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,#1b1060cc,#07304ecc)}
.hero h1{font-family:Orbitron;font-size:clamp(24px,6vw,44px);margin:0 0 8px;line-height:1.1}
.hero p{margin:0;color:var(--mut);max-width:48ch}
nav{display:flex;gap:8px;margin:18px 0}
nav button,.btn{font:inherit;font-weight:600;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;cursor:pointer}
nav button.on,.btn.go{background:linear-gradient(90deg,var(--v),var(--c));border-color:transparent;color:#041}
button:focus-visible,input:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.thumb{height:130px;display:grid;place-items:center;font-size:58px}
.card .in{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-family:Orbitron;font-size:17px}
.card p{margin:0;color:var(--mut);font-size:14px;flex:1}
.best{font-size:13px;color:var(--c)}
.av{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:12px}
.av button{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 6px;color:var(--txt);cursor:pointer;font:inherit}
.av button.sel{border-color:var(--c);box-shadow:0 0 14px #00e5ff55}
.av span{display:block;font-size:34px}
input{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;width:min(100%,280px)}
.hide{display:none}
#modal{position:fixed;inset:0;z-index:5;background:#030310ee;display:none;place-items:center;padding:12px}
#modal.on{display:grid}
.box{position:relative;width:min(100%,420px)}
canvas#cv{width:100%;height:auto;border:2px solid var(--v);border-radius:16px;box-shadow:0 0 30px #7c5cff77;touch-action:none;display:block;background:#060616}
#res{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#060616dd;border-radius:16px;text-align:center}
#res.on{display:flex}
#res h2{font-family:Orbitron;margin:0}
.x{position:absolute;top:-14px;right:-6px;z-index:2;border-radius:50%;width:36px;height:36px;padding:0}
@media (prefers-reduced-motion:reduce){#stars{display:none}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <div class="logo">SPACERZ ZONE</div>
    <div class="me"><span id="mAv">🧑‍🚀</span><b id="mName">Cadet</b><span>Lv <span id="mLv">1</span></span><span class="coin">🪙 <span id="mCoin">0</span></span></div>
  </header>
  <section class="hero">
    <h1>Launch into the next game.</h1>
    <p>Play space games, earn coins, and unlock new astronaut avatars for your profile.</p>
  </section>
  <nav><button class="on" data-t="games">Games</button><button data-t="me">Profile</button></nav>
  <div id="games" class="grid"></div>
  <div id="me" class="hide">
    <label for="nm">Your name</label><br>
    <input id="nm" maxlength="14">
    <p style="color:var(--mut)">Pick an avatar. Locked ones cost coins.</p>
    <div class="av" id="avs"></div>
  </div>
</div>

<div id="modal">
  <div class="box">
    <button class="btn x" id="close" aria-label="Close game">✕</button>
    <canvas id="cv" width="420" height="560"></canvas>
    <div id="res"><h2 id="rt"></h2><div id="rs"></div><button class="btn go" id="again">Play again</button><button class="btn" id="exit">Back to games</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const GAMES=[
 {id:'dodge',t:'Asteroid Dodger',e:'🪨',d:'Steer your ship and survive the asteroid storm for as long as you can.',g:'#3a1a8a,#0a5a8a'},
 {id:'catch',t:'Star Catcher',e:'⭐',d:'Collect falling stars. Touch an asteroid and the run is over.',g:'#8a1a6a,#3a2a9a'},
 {id:'tap',t:'Alien Tapper',e:'👽',d:'Aliens pop up for a split second. Tap as many as you can in 30 seconds.',g:'#0a6a4a,#1a2a7a'}
];
const AVS=[['🧑‍🚀',0],['👽',0],['🤖',30],['🦊',50],['🐙',80],['🛸',120],['☄️',200],['🌌',300]];
let S={name:'Cadet',av:'🧑‍🚀',coins:0,xp:0,best:{},own:['🧑‍🚀','👽']};
try{const r=localStorage.getItem('spacerz');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('spacerz',JSON.stringify(S))}catch(e){}hud()}
function hud(){$('mAv').textContent=S.av;$('mName').textContent=S.name;$('mLv').textContent=Math.floor(S.xp/100)+1;$('mCoin').textContent=S.coins}
function renderGames(){
 $('games').innerHTML=GAMES.map(g=>`<div class="card"><div class="thumb" style="background:linear-gradient(135deg,${g.g})">${g.e}</div><div class="in"><h3>${g.t}</h3><p>${g.d}</p><div class="best">Best: ${S.best[g.id]||0}</div><button class="btn go" data-g="${g.id}">Play</button></div></div>`).join('');
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>play(b.dataset.g));
}
function renderAvs(){
 $('avs').innerHTML=AVS.map(([a,p])=>{const own=S.own.includes(a);return `<button data-a="${a}" class="${S.av===a?'sel':''}"><span>${a}</span>${own?(S.av===a?'Equipped':'Equip'):'🪙 '+p}</button>`}).join('');
 document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.a,p=AVS.find(x=>x[0]===a)[1];
  if(!S.own.includes(a)){if(S.coins<p){b.lastChild.textContent='Need '+(p-S.coins)+' more';return}S.coins-=p;S.own.push(a)}
  S.av=a;save();renderAvs()});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 $('games').classList.toggle('hide',b.dataset.t!=='games');$('me').classList.toggle('hide',b.dataset.t!=='me');
 if(b.dataset.t==='me'){$('nm').value=S.name;renderAvs()}});
$('nm').oninput=e=>{S.name=e.target.value.trim()||'Cadet';save()};

/* background starfield */
(function(){const c=$('stars'),x=c.getContext('2d');let W,H,st=[];
 function rs(){W=c.width=innerWidth;H=c.height=innerHeight;st=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,v:Math.random()*.25+.05}))}
 rs();addEventListener('resize',rs);
 (function f(){x.clearRect(0,0,W,H);x.fillStyle='#fff';for(const s of st){s.y+=s.v;if(s.y>H)s.y=0;x.globalAlpha=.4+s.r/3;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}requestAnimationFrame(f)})()})();

/* game engine */
let cur=null,raf=0,keys={};
addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);
function play(id){
 cancelAnimationFrame(raf);cur=id;$('modal').classList.add('on');$('res').classList.remove('on');
 const cv=$('cv'),x=cv.getContext('2d'),W=420,H=560;
 let run=true,score=0,px=W/2,items=[],sp=0,t0=performance.now(),last=t0,bgs=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.5}));
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
 cv.onpointermove=e=>{px=pos(e)[0]};
 cv.onpointerdown=e=>{const[p,q]=pos(e);px=p;if(id==='tap')for(let i=items.length-1;i>=0;i--){const a=items[i];if(Math.hypot(a.x-p,a.y-q)<34){score+=10;items.splice(i,1);break}}};
 const emo=(t,px_,py,s)=>{x.font=s+'px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,px_,py)};
 function end(){run=false;const win=Math.floor(score/10);S.coins+=win;S.xp+=Math.floor(score/4);
  if(score>(S.best[id]||0))S.best[id]=score;save();renderGames();
  $('rt').textContent='Run complete';$('rs').innerHTML='Score <b>'+score+'</b><br>+'+win+' 🪙 coins';$('res').classList.add('on')}
 function loop(n){
  if(!run)return;const dt=Math.min(.05,(n-last)/1000);last=n;const el=(n-t0)/1000;
  x.fillStyle='#060616';x.fillRect(0,0,W,H);x.fillStyle='#fff';
  for(const s of bgs){s.y=(s.y+40*dt)%H;x.globalAlpha=.6;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}x.globalAlpha=1;
  if(keys.ArrowLeft||keys.a)px-=380*dt;if(keys.ArrowRight||keys.d)px+=380*dt;px=Math.max(24,Math.min(W-24,px));
  sp+=dt;
  if(id==='tap'){
   if(sp>.55){sp=0;items.push({x:40+Math.random()*(W-80),y:60+Math.random()*(H-120),life:1.1,k:Math.random()<.2?'🛸':'👽'})}
   for(let i=items.length-1;i>=0;i--){items[i].life-=dt;if(items[i].life<=0){items.splice(i,1);continue}emo(items[i].k,items[i].x,items[i].y,46)}
   if(el>=30){end();return}
  }else{
   if(sp>Math.max(.22,.75-el*.012)){sp=0;items.push({x:20+Math.random()*(W-40),y:-24,v:130+el*6+Math.random()*90,k:(id==='catch'&&Math.random()<.5)?'⭐':(Math.random()<.2?'☄️':'🪨')})}
   for(let i=items.length-1;i>=0;i--){const a=items[i];a.y+=a.v*dt;emo(a.k,a.x,a.y,34);
    if(Math.hypot(a.x-px,a.y-(H-60))<30){if(a.k==='⭐'){score+=10;items.splice(i,1);continue}end();return}
    if(a.y>H+30)items.splice(i,1)}
   if(id==='dodge')score=Math.floor(el*10);
   emo(S.av,px,H-60,42);
  }
  x.fillStyle='#eef0ff';x.font='700 18px Orbitron,sans-serif';x.textAlign='left';x.fillText('Score '+score,14,24);
  if(id==='tap'){x.textAlign='right';x.fillText(Math.max(0,Math.ceil(30-el))+'s',W-14,24)}
  raf=requestAnimationFrame(loop)}
 raf=requestAnimationFrame(loop);
}
$('again').onclick=()=>play(cur);
function quit(){cancelAnimationFrame(raf);$('modal').classList.remove('on')}
$('exit').onclick=quit;$('close').onclick=quit;
hud();renderGames();
</script>
</body>
</html>
